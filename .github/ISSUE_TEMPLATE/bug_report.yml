name: 问题反馈 / Bug report
description: 报告可以复现的问题，帮助我们定位并修复。
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: 请先查看使用指南的故障排查。不要粘贴密码、Token、API Key 或私有项目内容；敏感漏洞请查看 SECURITY.md。
  - type: input
    id: version
    attributes:
      label: RoamDeck 版本
      placeholder: 例如 0.4.5；请分别注明 App 与服务器版本
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: 使用入口
      options:
        - Android App
        - 手机浏览器
        - 电脑浏览器
        - 服务端安装或运行
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境
      placeholder: 手机型号 / Android 版本 / 浏览器版本；服务端操作系统与 CPU 架构
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: "1. 打开…\n2. 点击…\n3. 出现…"
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 实际结果与预期结果
      placeholder: 实际发生了什么？你原本期望什么？
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 截图或日志（可选，先脱敏）
      description: 只包含定位问题所需的信息；日志较长时请保留错误附近内容。
