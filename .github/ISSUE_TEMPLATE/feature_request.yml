name: 功能建议 / Feature request
description: 描述你希望完成的工作和当前遇到的阻碍。
title: "[Feature] "
body:
  - type: textarea
    id: need
    attributes:
      label: 你想完成什么工作？
      placeholder: 使用场景是什么，现在卡在哪里？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望如何操作？
      placeholder: 描述预期流程、效果或具体例子。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的方法或补充参考（可选）
