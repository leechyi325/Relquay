name: Android APK

on:
  workflow_dispatch:
    inputs:
      origin:
        description: 初始服务器地址（可留空，安装后也可在 App 内添加）
        required: false
        default: ''
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # ubuntu-latest 已预装 Android SDK 与命令行工具，直接补齐所需版本。
      - name: Install SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci
      # 固定签名密钥放在仓库 Secrets（RELQUAY_KEYSTORE_B64 / RELQUAY_KEYSTORE_PASSWORD），没配置时回退到临时 debug 签名。
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.RELQUAY_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/relquay.jks"
            echo "RELQUAY_KEYSTORE=$RUNNER_TEMP/relquay.jks" >> "$GITHUB_ENV"
          fi
      - name: Build debug APK
        env:
          VITE_STUDIO_ORIGIN: ${{ inputs.origin }}
          RELQUAY_KEYSTORE_PASSWORD: ${{ secrets.RELQUAY_KEYSTORE_PASSWORD }}
        run: |
          # ${{ env.* }} 读不到 runner 自带的环境变量，这里在 shell 里取。
          export STUDIO_JAVA_HOME="$JAVA_HOME" STUDIO_ANDROID_SDK="$ANDROID_HOME"
          chmod +x android/gradlew
          [ -n "$VITE_STUDIO_ORIGIN" ] || unset VITE_STUDIO_ORIGIN
          bash scripts/build-android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: relquay-debug-apk
          path: artifacts/relquay-*-debug.apk
          if-no-files-found: error
          retention-days: 30
